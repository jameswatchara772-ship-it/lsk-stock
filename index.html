<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>คลังยา หล่มสัก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: scan-first single column — one big scan target, everything else one tap away. */
:root {
  --bg: #EDF2F1;
  --surface: #FFFFFF;
  --surface-2: #F4F8F7;
  --line: #D5E0DE;
  --ink: #0F1D1B;
  --ink-2: #455956;
  --ink-3: #7A8D8A;
  --accent: #0F766E;
  --accent-ink: #FFFFFF;
  --accent-soft: #D4EEEA;
  --out: #D9560A;  --out-soft: #FCEADC;
  --in: #08875A;   --in-soft: #DAF3E7;
  --count: #2457D6; --count-soft: #E0E9FD;
  --neg: #C42727;  --neg-soft: #FCE3E3;
  --low: #A85407;  --low-soft: #FDEFD2;
  --exp: #7036D9;  --exp-soft: #ECE5FD;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(15,29,27,.05), 0 6px 18px rgba(15,29,27,.06);
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  --font-display: "Bai Jamjuree", "IBM Plex Sans Thai", "Noto Sans Thai", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1413; --surface: #12201E; --surface-2: #172826; --line: #253A37;
    --ink: #E6F0EE; --ink-2: #A5B9B6; --ink-3: #728784;
    --accent: #2BC4B1; --accent-ink: #032C28; --accent-soft: #113B36;
    --out: #FB8C3C; --out-soft: #3A2312; --in: #34D399; --in-soft: #0E3124;
    --count: #6EA3FA; --count-soft: #15284A; --neg: #F47272; --neg-soft: #3A1616;
    --low: #F5B83A; --low-soft: #382A0D; --exp: #A98BFA; --exp-soft: #291E48;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1413; --surface: #12201E; --surface-2: #172826; --line: #253A37;
  --ink: #E6F0EE; --ink-2: #A5B9B6; --ink-3: #728784;
  --accent: #2BC4B1; --accent-ink: #032C28; --accent-soft: #113B36;
  --out: #FB8C3C; --out-soft: #3A2312; --in: #34D399; --in-soft: #0E3124;
  --count: #6EA3FA; --count-soft: #15284A; --neg: #F47272; --neg-soft: #3A1616;
  --low: #F5B83A; --low-soft: #382A0D; --exp: #A98BFA; --exp-soft: #291E48;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.25; }

#app { max-width: 540px; margin: 0 auto; min-height: 100%; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
.demo-bar { margin: 0 -16px; padding: 8px 16px; background: #1F2A29; color: #F2F6F5; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.demo-bar b { color: #FCD34D; font-weight: 600; }
.demo-bar .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.demo-bar button { padding: 3px 10px; border-radius: 99px; border: 1px solid #4B5B59; font-size: 12.5px; }
.demo-bar button.on { background: #FCD34D; color: #1F2A29; border-color: #FCD34D; font-weight: 600; }

.topbar { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 0 10px; }
.topbar .title { flex: 1; min-width: 0; }
.topbar .title h2 { font-size: 19px; }
.topbar .title small { display: block; color: var(--ink-3); font-size: 12.5px; }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; overflow: hidden; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.sec-title { font-size: 14px; font-weight: 600; color: var(--ink-2); margin: 18px 4px 8px; display: flex; justify-content: space-between; align-items: baseline; }
.sec-title button { color: var(--accent); font-size: 14px; font-weight: 600; }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip svg { width: 13px; height: 13px; }
.chip.had { background: var(--neg); color: #fff; }
.chip.cold { background: #0284C7; color: #fff; }
.chip.lock { background: #334155; color: #fff; }
.chip.neg { background: var(--neg-soft); color: var(--neg); }
.chip.low { background: var(--low-soft); color: var(--low); }
.chip.over { background: var(--exp-soft); color: var(--exp); }
.chip.ok { background: var(--in-soft); color: var(--in); }
.chip.queue { background: var(--low-soft); color: var(--low); }
.chip.fail { background: var(--neg-soft); color: var(--neg); }

/* ---------- home ---------- */
.hello small { color: var(--ink-3); font-size: 13px; }
.hello h1 { font-size: 24px; }
.role { display: inline-block; margin-top: 4px; font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 99px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { padding: 9px 6px; border-radius: 10px; font-weight: 600; font-size: 15px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; justify-content: center; }
.seg button svg { width: 18px; height: 18px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button.on.m-OUT { color: var(--out); } .seg button.on.m-IN { color: var(--in); } .seg button.on.m-COUNT { color: var(--count); }
.seg .badge { font-size: 11px; background: var(--neg); color: #fff; border-radius: 99px; padding: 0 6px; line-height: 17px; }

.picker { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; text-align: left; }
.picker .lbl { font-size: 12.5px; color: var(--ink-3); display: block; }
.picker .val { font-weight: 600; font-size: 16px; display: block; }
.picker .grow { flex: 1; min-width: 0; }
.picker svg { width: 20px; height: 20px; color: var(--ink-3); }
.picker.unset .val { color: var(--neg); }

.scan-btn { --c: var(--out); width: 100%; border-radius: 24px; padding: 22px 20px; background: var(--c); color: #fff; display: flex; align-items: center; gap: 18px; text-align: left; box-shadow: 0 10px 24px color-mix(in srgb, var(--c) 35%, transparent); }
.scan-btn.m-IN { --c: var(--in); } .scan-btn.m-COUNT { --c: var(--count); }
.scan-btn .ico { width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
.scan-btn .ico svg { width: 38px; height: 38px; stroke-width: 2.2; }
.scan-btn b { font-family: var(--font-display); font-size: 24px; display: block; line-height: 1.2; }
.scan-btn small { opacity: .9; font-size: 14px; }
.scan-btn:active { transform: scale(.985); }
.search-fake { display: flex; align-items: center; gap: 10px; width: 100%; padding: 13px 14px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); color: var(--ink-3); text-align: left; }
.search-fake svg { width: 20px; height: 20px; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 12px; text-align: left; border-top: 4px solid var(--c); }
.tile b { font-family: var(--font-display); font-size: 26px; display: block; color: var(--c); line-height: 1.15; }
.tile span { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; display: block; }
.tile.t-neg { --c: var(--neg); } .tile.t-low { --c: var(--low); } .tile.t-exp { --c: var(--exp); }

/* ---------- list rows ---------- */
.list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; gap: 12px; align-items: center; padding: 12px 14px; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .main { flex: 1; min-width: 0; }
.item .name { font-weight: 600; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.item .right { text-align: right; flex: none; }
.item .right b { font-size: 16px; font-variant-numeric: tabular-nums; display: block; }
.item .right small { font-size: 12px; color: var(--ink-3); }
.item.void .name, .item.void .right b { text-decoration: line-through; color: var(--ink-3); }
.ztile { width: 44px; height: 44px; border-radius: 12px; background: var(--z); color: #fff; display: grid; place-items: center; flex: none; font-family: var(--font-display); font-weight: 700; line-height: 1; text-align: center; }
.ztile b { font-size: 18px; display: block; }
.ztile small { font-size: 10px; font-family: var(--font-mono); opacity: .92; display: block; margin-top: 2px; }
.tx-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.tx-ico svg { width: 20px; height: 20px; }
.tx-OUT { background: var(--out-soft); color: var(--out); } .tx-IN { background: var(--in-soft); color: var(--in); } .tx-COUNT { background: var(--count-soft); color: var(--count); }
.day-head { font-size: 13px; font-weight: 600; color: var(--ink-3); padding: 14px 6px 6px; }
.add-btn { width: 38px; height: 38px; border-radius: 12px; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--accent); flex: none; }
.add-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.add-btn svg { width: 18px; height: 18px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-3); font-size: 14px; }

/* ---------- search ---------- */
.search-input { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 4px 6px 4px 14px; }
.search-input svg { width: 20px; height: 20px; color: var(--ink-3); flex: none; }
.search-input input { flex: 1; border: 0; outline: 0; background: none; padding: 10px 0; font-size: 17px; min-width: 0; }
.zfilter { display: flex; gap: 6px; overflow-x: auto; padding: 10px 2px 2px; scrollbar-width: none; }
.zfilter button { flex: none; padding: 5px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--ink-2); }
.zfilter button.on { background: var(--z, var(--accent)); border-color: var(--z, var(--accent)); color: #fff; }

/* ---------- drug ---------- */
.drug-name { font-size: 21px; overflow-wrap: anywhere; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.info2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bal-card .lbl, .loc-card .lbl { font-size: 12.5px; color: var(--ink-3); }
.bal-num { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.bal-num.neg { color: var(--neg); }
.bal-unit { font-size: 14px; color: var(--ink-2); }
.minmax { height: 6px; border-radius: 99px; background: var(--surface-2); position: relative; margin: 10px 0 4px; overflow: visible; }
.minmax .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--c, var(--in)); }
.minmax .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-3); }
.mm-legend { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); }
.loc-card { --z: #475569; position: relative; overflow: hidden; }
.loc-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--z); }
.loc-code { font-family: var(--font-mono); font-size: 22px; font-weight: 600; color: var(--z); letter-spacing: .5px; }
.loc-line { font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.shelf { display: block; margin-top: 8px; }
.fefo { display: flex; gap: 10px; align-items: center; background: var(--exp-soft); color: var(--exp); border-radius: 14px; padding: 10px 12px; font-size: 14px; }
.fefo svg { width: 20px; height: 20px; flex: none; }
.fefo b { font-weight: 700; }
.warn { display: flex; gap: 10px; align-items: flex-start; background: var(--low-soft); color: var(--low); border-radius: 14px; padding: 10px 12px; font-size: 14px; line-height: 1.45; }
.warn.danger { background: var(--neg-soft); color: var(--neg); }
.warn svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }

.qty-box { --c: var(--out); background: var(--surface); border: 2px solid var(--c); border-radius: 18px; padding: 10px 14px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; }
.qty-box.m-IN { --c: var(--in); } .qty-box.m-COUNT { --c: var(--count); }
.qty-box .q { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--c); min-height: 44px; }
.qty-box .q.ph { color: var(--ink-3); font-weight: 600; }
.qty-box .u { font-size: 15px; color: var(--ink-2); font-weight: 600; text-align: right; }
.qty-box .conv { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.qty-box .conv b { color: var(--ink); }
.qty-box .conv .bad { color: var(--neg); font-weight: 600; }
.units { --c: var(--out); --cs: var(--out-soft); display: flex; gap: 8px; flex-wrap: wrap; padding-top: 6px; }
.units.m-IN { --c: var(--in); --cs: var(--in-soft); } .units.m-COUNT { --c: var(--count); --cs: var(--count-soft); }
.unit { position: relative; min-width: 78px; min-height: 52px; padding: 6px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); display: grid; justify-items: center; align-content: center; line-height: 1.2; }
.unit b { font-size: 16px; } .unit small { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.unit.on { border-color: var(--c); background: var(--cs); color: var(--c); }
.unit.on small { color: var(--c); }
.unit .cnt { position: absolute; top: -9px; right: -7px; background: var(--c); color: #fff; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 0 7px; line-height: 20px; font-variant-numeric: tabular-nums; }
.unit.add { min-width: 52px; border-style: dashed; color: var(--ink-3); }
.unit.add svg { width: 20px; height: 20px; }
.qty-box .breakdown { grid-column: 1 / -1; font-size: 15px; color: var(--ink); background: var(--surface-2); border-radius: 10px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.qty-box .breakdown b { color: var(--c); font-size: 17px; }
.pack-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto 92px auto 40px; gap: 6px; align-items: center; font-weight: 600; }
.pack-row input { width: 100%; min-width: 0; padding: 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; outline: 0; }
.pack-row input:focus { border-color: var(--accent); }
.pack-row input.bad { border-color: var(--neg); }
.pack-row .icon-btn { width: 40px; height: 40px; box-shadow: none; background: var(--surface-2); }
.pack-row .icon-btn svg { width: 18px; height: 18px; }
.pack-preview { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { height: 54px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); font-family: var(--font-display); font-size: 24px; font-weight: 600; }
.keypad button:active { background: var(--surface-2); transform: scale(.97); }
.keypad button.fn { font-family: var(--font-body); font-size: 15px; color: var(--ink-2); background: var(--surface-2); box-shadow: none; }
.keypad button svg { width: 24px; height: 24px; }
.field { display: grid; gap: 4px; align-content: start; }
.field label { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.field input, .field select, .field textarea { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; outline: 0; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field .hint { font-size: 12.5px; color: var(--ink-3); }
.field .hint.ok { color: var(--in); } .field .hint.bad { color: var(--neg); }
.fields2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; border-radius: 16px; font-weight: 700; font-size: 17px; padding: 10px 16px; background: var(--accent); color: var(--accent-ink); }
.btn svg { width: 22px; height: 22px; }
.btn.m-OUT { background: var(--out); color: #fff; } .btn.m-IN { background: var(--in); color: #fff; } .btn.m-COUNT { background: var(--count); color: #fff; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.btn.soft { background: var(--surface-2); color: var(--ink-2); }
.btn.danger { background: var(--neg-soft); color: var(--neg); }
.btn.sm { min-height: 42px; font-size: 15px; border-radius: 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btns2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.link { color: var(--accent); font-weight: 600; font-size: 14px; display: inline-flex; gap: 4px; align-items: center; }
.link svg { width: 16px; height: 16px; }

/* ---------- tab bar ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
.tabbar .in { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.tabbar button { display: grid; justify-items: center; gap: 2px; font-size: 11.5px; color: var(--ink-3); padding: 4px 0; position: relative; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button.on { color: var(--accent); font-weight: 600; }
.tabbar .fab { width: 60px; height: 60px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin: -22px auto 0; box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 40%, transparent); }
.tabbar .fab svg { width: 30px; height: 30px; }
.tabbar .dot { position: absolute; top: 0; right: 22%; min-width: 18px; height: 18px; border-radius: 99px; background: var(--neg); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 4px; }

/* ---------- sheets / toast ---------- */
.scrim { position: fixed; inset: 0; background: rgba(5,15,14,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease; }
.sheet { background: var(--bg); width: 100%; max-width: 540px; max-height: 92%; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); animation: up .2s ease; }
.sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 12px; }

/** "0370" / "03/70" / "03/2570" / "3/2027" → "2027-03" (ปี 2 หลัก ≥50 ถือเป็น พ.ศ.) */
function parseExp(s) {
  s = String(s || "").replace(/\s/g, "");
  if (!s) return "";
  let m = s.match(/^(\d{1,2})[\/\-\.]?(\d{2}|\d{4})$/);
  if (!m) return null;

  if (m[2].length === 2) y = y >= 50 ? 2500 + y - 543 : 2000 + y;

}

  const list = (lots || []).map(l => Object.assign({}, l)).sort((a, b) => (b.exp || "9999") < (a.exp || "9999") ? -1 : 1);
  let left = Math.max(0, bal);

/* ---------- หน่วยบรรจุ (หน่วยใหญ่) ---------- */
// หน่วยที่กดนับได้: หน่วยใหญ่เรียงจากใหญ่ → เล็ก แล้วตามด้วยหน่วยนับ (k = "base")
function unitsOf(s) {
  return (s.ps || []).slice().sort((a, b) => b.q - a.q).map(p => ({ n: p.n, q: p.q, k: p.n + ":" + p.q })).concat([{ n: s.u, q: 1, k: "base" }]);
}
const qtyEntered = D => Object.keys(D.counts).some(k => D.counts[k] !== "");
function qtyTotal(D, s) { return round2(unitsOf(s).reduce((t, u) => t + Number(D.counts[u.k] || 0) * u.q, 0)); }
function qtyBreakdown(D, s, withSize) {
  return unitsOf(s).filter(u => Number(D.counts[u.k]) > 0).map(u => fmtN(D.counts[u.k]) + " " + u.n + (withSize && u.q > 1 ? " (×" + fmtN(u.q) + ")" : "")).join(" + ");
}
function packText(s) { return (s.ps || []).slice().sort((a, b) => a.q - b.q).map(p => "1 " + p.n + " = " + fmtN(p.q) + " " + s.u).join(" · "); }
/** แตกยอดเป็นหน่วยใหญ่แบบแม่นยำ (ไม่ปัดเศษ) เช่น 10,535 → 21 กล่อง · 3 แผง · 5 เม็ด */
function packBreak(total, s) {
  let left = Math.max(0, total);
  const parts = [];
  unitsOf(s).filter(u => u.q > 1).forEach(u => { const k = Math.floor(left / u.q); if (k) { parts.push(fmtN(k) + " " + u.n); left = round2(left - k * u.q); } });

}
function packPresets(u) {
  const t = String(u || "").toLowerCase();
  if (/เม็ด|แคปซูล|tab|cap/.test(t)) return [["แผง", 10], ["แผง", 7], ["แผง", 14], ["กล่อง", 100], ["กล่อง", 500], ["กล่อง", 1000], ["ขวด", 500], ["ขวด", 1000]];

  if (/amp|vial|หลอด|syringe|pen/.test(t)) return [["กล่อง", 5], ["กล่อง", 10], ["กล่อง", 25], ["กล่อง", 50], ["กล่อง", 100]];

/** ตรวจแถวหน่วยบรรจุ — คืนข้อความผิดรายแถว (ตรงกับที่เซิร์ฟเวอร์ตรวจ) */
function packErrors(rows, base) {

async function api(action, payload) {

    res = await fetch(CONFIG.API_URL, { method: "POST", body: JSON.stringify(Object.assign({ action, token: S.token }, payload || {})), redirect: "follow" });
  } catch (e) {
    throw new ApiError("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (" + (e.message || e) + ") — ตรวจสอบสัญญาณอินเทอร์เน็ต", "NETWORK", true);
  }
  const txt = await res.text();
  let j;
  try { j = JSON.parse(txt); } catch (e) {
    throw new ApiError("เซิร์ฟเวอร์ตอบกลับไม่ใช่ JSON (HTTP " + res.status + "): " + txt.slice(0, 300), "BAD_RESPONSE", res.status >= 500);
  }
  if (!j.ok) throw new ApiError(j.error || "เกิดข้อผิดพลาดไม่ทราบสาเหตุ", j.code);

}

function searchDrugs(q, zf) {

  const exact = S.drugs.get(q.trim().toUpperCase()) || S.drugs.get(S.hx.get(q.trim()));
  const scored = [];
  res.forEach(d => {
    let s = 0;
    const n = norm(d.n), g = norm(d.g);

    else if (d._k.includes(k)) s = 40;

}

/* ========================= sheets & toast ========================= */
let sheetOpen = null;
function openSheet(html, onClose) {
  closeSheet(true);
  const el = document.createElement("div");
  el.className = "scrim";
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  el.addEventListener("click", e => { if (e.target === el) closeSheet(); });
  $("#layer").appendChild(el);
  sheetOpen = { el, onClose };
  return el;
}
function closeSheet(silent) {
  if (!sheetOpen) return false;
  const s = sheetOpen; sheetOpen = null; s.el.remove();
  if (!silent && s.onClose) s.onClose();
  return true;
}
let toastTimer;
function toast(msg, bad) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), bad ? 6000 : 2600);
}
function confirmSheet(title, msg, okLabel, cls) {
  return new Promise(res => {
    const el = openSheet(`<h3>${esc(title)}</h3><p class="muted">${msg}</p><div class="btns2"><button class="btn soft" data-r="0">ยกเลิก</button><button class="btn ${cls || ""}" data-r="1">${esc(okLabel)}</button></div>`, () => res(false));
    el.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => { const v = b.dataset.r === "1"; closeSheet(true); res(v); }));
  });
}
function destSheet(kind, current, onPick) {
  const list = S.dests.filter(d => d.type === kind);
  const normal = list.filter(d => !d.headOnly), special = list.filter(d => d.headOnly);
  const opt = d => `<button class="opt ${d.name === current ? "on" : ""}" data-name="${esc(d.name)}"><span>${esc(d.name)}</span>${d.name === current ? I.check : ""}</button>`;
  const el = openSheet(`<h3>${kind === "OUT" ? "จ่ายให้หน่วยเบิก" : "รับจาก"}</h3><p class="faint" style="font-size:13px;margin:0 0 10px">ระบบจำค่านี้ไว้ใช้กับทุกรายการถัดไป</p>
    <div class="opt-list">${normal.map(opt).join("")}</div>${special.length ? `<div class="sec-title"><span>เฉพาะหัวหน้าคลัง</span></div><div class="opt-list">${special.map(opt).join("")}</div>` : ""}`);
  el.querySelectorAll("[data-name]").forEach(b => b.addEventListener("click", () => { closeSheet(true); onPick(b.dataset.name); }));
}

/* ========================= drug screen ========================= */
function resolveCode(raw) {
  const v = String(raw || "").trim();
  if (!v) return "";
  let m = v.match(/[?&]d=([A-Za-z0-9]+)/);
  if (m) return m[1].toUpperCase();
  m = v.toUpperCase().match(/\bD\d{4}\b/);
  if (m) return m[0];
  const gs = parseGS1(v);
  if (gs && gs.gtin && S.gtin.get(gs.gtin)) { S.lastGs1 = gs; return S.gtin.get(gs.gtin); }
  if (/^\d{8,14}$/.test(v) && S.gtin.get(normGtin(v))) return S.gtin.get(normGtin(v));
  if (S.hx.get(v)) return S.hx.get(v);
  return S.drugs.get(v.toUpperCase()) ? v.toUpperCase() : "";
}
async function openDrug(code, fromUrl) {
  if (!S.drugs.get(code)) { toast("ไม่พบรหัสยา “" + code + "” ในทะเบียน", true); if (fromUrl) go("home"); return; }
  S.recentDrugs = [code].concat(S.recentDrugs.filter(c => c !== code)).slice(0, 12);
  store.set("recentDrugs", S.recentDrugs);
  const pickItem = S.pick.find(p => p.c === code);
  const pref = (store.get("unitPref", {}) || {})[code] || "base";
  S.drug = { code, counts: pickItem && pickItem.q ? { base: String(pickItem.q) } : {}, ui: pickItem && pickItem.q ? "base" : pref, lot: "", exp: "", loading: true, lots: null, recent: null, src: {} };
  const gs = S.lastGs1; S.lastGs1 = null;
  if (gs && S.mode === "IN") { if (gs.lot) { S.drug.lot = gs.lot; S.drug.src.lot = "bc"; } if (gs.exp) { S.drug.exp = expToInput(gs.exp); S.drug.src.exp = "bc"; } }
  if (S.mode === "IN" && S.rx) rxFill(code, true);
  go("drug", !fromUrl);
  try {
    const r = await api("drug", { code });
    if (!S.drug || S.drug.code !== code) return;
    const x = S.drugs.get(r.drug.c);
    if (x) Object.assign(x, r.drug, { _k: x._k });
    applyOutboxOptimistic();
    Object.assign(S.drug, { lots: r.lots, recent: r.recent, loading: false });
    if (r.pending) { const st = stockCodeOf(code); S.putaway = (S.putaway || []).filter(p => p.stock !== st).concat(r.pending).sort((a, b) => (a.time < b.time ? -1 : 1)); }
  } catch (e) {
    if (S.drug && S.drug.code === code) S.drug.loading = false;
    toast("อัปเดตยอดล่าสุดไม่ได้: " + e.message, true);
  }
  if (S.view === "drug") render();
}
function refreshDrugView() {
  if (S.view !== "drug") return;
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

/* ========================= save + outbox ========================= */
async function doSave() {
  const D = S.drug, d = S.drugs.get(D.code), s = stockOf(d), mode = S.mode;
  const base = qtyTotal(D, s);
  const usedPack = unitsOf(s).some(u => u.q > 1 && Number(D.counts[u.k]) > 0);
  if (isAbnormal(s, base) && !(await confirmSheet("จำนวนมากผิดปกติ", `ยืนยันบันทึก <b>${fmtN(base)} ${esc(s.u)}</b> ใช่หรือไม่? (ใช้เฉลี่ย ${fmtN(s.av)} ต่อเดือน)`, "ยืนยัน", "m-" + mode))) return;
  if (mode === "IN" && !(await confirmReceiveDup(d, s))) return;
  const txn = { id: uid(), code: d.c, type: mode, qty: base, time: new Date().toISOString() };
  if (mode === "OUT") txn.dest = S.destOut;
  if (mode === "IN") {
    txn.dest = S.destIn; txn.lot = D.lot.trim().toUpperCase(); txn.exp = parseExp(D.exp) || ""; txn.doc = S.doc.trim();
    const ev = rxEvidenceFor(d.c);
    if (ev.length) txn.ev = ev;
    const fromImg = Object.keys(D.src || {}).filter(k => D.src[k]);
    if (fromImg.length) txn.note = "ช่วยกรอกจากภาพ: " + fromImg.map(k => ({ qty: "จำนวน", lot: "Lot", exp: "EXP", doc: "เลขที่เอกสาร" }[k])).join("/");
  }
  if (usedPack) txn.note = [qtyBreakdown(D, s, true) + " = " + fmtN(base) + " " + s.u, txn.note].filter(Boolean).join(" · ");
  const before = s.b;
  const item = { txn, state: "pending", tries: 0, before };
  outbox.items.push(item);
  persistOutbox();
  applyLocal(txn, s);
  const pickItem = S.pick.find(p => p.c === d.c);
  if (pickItem && mode === "OUT") { pickItem.done = true; store.set("pick", S.pick); }
  showResult(item, d, s);
  processOutbox();
}
function applyLocal(txn, s) {
  if (txn.type === "OUT") s.b = round2(s.b - txn.qty);
  else if (txn.type === "IN") s.b = round2(s.b + txn.qty);
  else s.b = txn.qty;
  s._pending = true;
}
function applyOutboxOptimistic() { outbox.items.forEach(i => { const d = S.drugs.get(i.txn.code); if (d && !i.applied) { /* ยอดจากเซิร์ฟเวอร์ยังไม่รวมรายการค้างส่ง */ applyLocal(i.txn, stockOf(d)); } }); }
function persistOutbox() { store.set("outbox", outbox.items.map(i => ({ txn: i.txn, state: i.state, tries: i.tries, error: i.error, before: i.before }))); }
async function processOutbox() {
  if (outbox.busy) return;
  outbox.busy = true;
  try {
    for (;;) {
      const item = outbox.items.find(i => i.state === "pending");
      if (!item) break;
      try {
        const r = await api("save", { txn: item.txn });
        outbox.items.splice(outbox.items.indexOf(item), 1);
        persistOutbox();
        const x = S.drugs.get(r.drug ? r.drug.c : item.txn.code);
        if (x && r.drug) { Object.assign(x, r.drug, { _k: x._k }); delete x._pending; }
        outbox.items.forEach(i => { const dd = S.drugs.get(i.txn.code); if (dd && stockOf(dd) === x) applyLocal(i.txn, x); });
        if (r.txn) { r.txn.bal = r.balance; S.recentTx = [r.txn].concat((S.recentTx || []).filter(t => t.id !== r.txn.id)).slice(0, 5); if (S.drug && S.drug.recent && stockOf(S.drugs.get(S.drug.code)) === x) S.drug.recent = [r.txn].concat(S.drug.recent).slice(0, 6); }
        if (r.over && S.alerts) S.alerts.neg = Math.max(S.alerts.neg, 1);
        if (r.txn && r.txn.type === "IN" && r.txn.status !== "ยกเลิก") {
          if (r.txn.pa === PA_WAIT && !(S.putaway || []).some(p => p.id === r.txn.id)) S.putaway = (S.putaway || []).concat([{ id: r.txn.id, code: r.txn.code, stock: r.txn.stock, name: r.txn.name, qty: r.txn.qty, unit: r.txn.unit, lot: r.txn.lot, exp: r.txn.exp, by: r.txn.by, time: r.txn.time, ev: r.txn.ev || [] }]);
          if (S.rx) { S.rx.received[r.txn.stock] = { qty: r.txn.qty, time: r.txn.time }; persistRx(); }
        }
        resolveWaiter(item.txn.id, { ok: true, r });
      } catch (e) {
        if (e.network) {
          item.tries++;
          resolveWaiter(item.txn.id, { ok: false, queued: true, e });
          persistOutbox();
          await new Promise(r => setTimeout(r, Math.min(30000, 2000 * item.tries)));
          if (!navigator.onLine) await new Promise(r => window.addEventListener("online", r, { once: true }));
        } else {
          item.state = "failed"; item.error = e.message;
          persistOutbox();
          resolveWaiter(item.txn.id, { ok: false, e });
        }
      }
      renderTabbar();
      if (S.view === "home" || S.view === "history") render();
      else refreshDrugView();
    }
  } finally { outbox.busy = false; renderTabbar(); }
}
function resolveWaiter(id, v) { const w = outbox.waiters[id]; if (w) { delete outbox.waiters[id]; w(v); } }
function waitFor(id, ms) { return new Promise(res => { outbox.waiters[id] = res; setTimeout(() => { if (outbox.waiters[id]) { delete outbox.waiters[id]; res({ ok: false, timeout: true }); } }, ms); }); }

function showResult(item, d, s) {

      ${t.type === "IN" && rxNext(t.code) ? `<button class="btn m-IN" data-r="next">${I.chev}รับรายการถัดไปในใบนี้: ${esc(rxNext(t.code).n)}</button>` : ""}
      <button class="btn ${t.type === "IN" && rxNext(t.code) ? "ghost" : "m-" + t.type}" data-r="scan">${I.scan}สแกนรายการถัดไป</button>

function openQueued(id) {

/* ========================= edit transaction ========================= */
function findTx(id) {
  const pools = [S.history && S.history.rows, S.recentTx, S.drug && S.drug.recent, S.card && S.card.rows];
  for (const p of pools) { const t = (p || []).find(x => x.id === id); if (t) return t; }
  return null;
}
function editTx(id, prev) {
  const t = findTx(id);
  if (!t) return toast("ไม่พบรายการ", true);
  const own = t.userId ? t.userId === S.me.userId : t.by === S.me.name;
  const editDays = (S.history && S.history.editDays) || S.config.editDays || 3;
  const inWindow = Date.now() - new Date(t.time).getTime() < editDays * 86400000;
  const allowed = can("editAny") || (can("editOwn") && own && inWindow);
  const isVoided = t.status === "ยกเลิก";
  const st = prev || { qty: String(t.qty), dest: t.dest, lot: t.lot, exp: t.exp ? fmtExp(t.exp) : "", reason: "" };
  const evHtml = t.type === "IN" ? `<div class="field" style="margin-bottom:10px"><label>หลักฐานการรับ${(t.ev || []).length ? " (" + t.ev.length + " ภาพ)" : ""}</label><div class="ev-strip">
      ${(t.ev || []).map(id => `<button class="ev-thumb" data-ev="${esc(id)}" aria-label="ดูภาพ"><span class="spinner"></span></button>`).join("")}
      ${can("IN") && !isVoided ? `<button class="ev-add" id="e-attach">${I.camera}<span>แนบรูป</span></button>` : (t.ev || []).length ? "" : `<span class="faint" style="font-size:13px;align-self:center">ไม่มีภาพ</span>`}</div>
      ${t.pa ? `<span class="hint" style="color:${t.pa === PA_WAIT ? "var(--low)" : "var(--in)"}">${t.pa === PA_WAIT ? "⏳ รอขึ้นชั้น" : "✓ " + esc(t.pa)}${t.paBy ? " · " + esc(t.paBy) : ""}${t.paAt ? " · " + dayLabel(t.paAt) + " " + fmtTime(t.paAt) : ""}</span>` : ""}</div>` : "";
  const draw = () => `
    <h3>${esc(T[t.type])} · ${esc(t.name)}</h3>
    <p class="faint" style="font-size:13px;margin:0 0 10px">${dayLabel(t.time)} ${fmtTime(t.time)} · ${esc(t.by)}${t.edited ? " · แก้ไขล่าสุด " + esc(t.edited) : ""}</p>${evHtml}
    ${isVoided ? `<div class="warn">${I.alert}<span>รายการนี้ถูกยกเลิกแล้ว</span></div>` : !allowed ? `<div class="warn">${I.lock}<span>${own ? "เกิน " + editDays + " วันแล้ว — แจ้งหัวหน้าคลังให้แก้ไขแทน" : "แก้ไขได้เฉพาะรายการที่ตนเองบันทึก"}</span></div>` : `
    <div class="stack">
      ${t.type !== "COUNT" ? `<div class="field"><label for="e-qty">จำนวน (${esc(t.unit)})${(() => { const dd = S.drugs.get(t.stock || t.code); return dd && (dd.ps || []).length ? " · " + esc(packText(dd)) : ""; })()}</label><input id="e-qty" class="mono" inputmode="decimal" value="${esc(st.qty)}" style="font-size:22px;font-weight:600"></div>` : `<div class="warn" style="background:var(--count-soft);color:var(--count)">${I.count}<span>รายการตรวจนับแก้จำนวนไม่ได้ — ยกเลิกแล้วตรวจนับใหม่</span></div>`}
      ${t.type === "OUT" ? `<button class="picker" id="e-dest"><span class="grow"><span class="lbl">หน่วยเบิก</span><span class="val">${esc(st.dest)}</span></span>${I.down}</button>` : ""}
      ${t.type === "IN" ? `<div class="fields2"><div class="field"><label for="e-lot">Lot</label><input id="e-lot" value="${esc(st.lot)}"></div><div class="field"><label for="e-exp">หมดอายุ (ดด/ปปปป)</label><input id="e-exp" inputmode="numeric" value="${esc(st.exp)}"></div></div>` : ""}
      <div class="field"><label>เหตุผลการแก้ไข (บันทึกในประวัติ)</label><div class="reason">${EDIT_REASONS.map(r => `<button data-reason="${r}" class="${st.reason === r ? "on" : ""}">${r}</button>`).join("")}</div></div>
      <div class="btns2"><button class="btn danger sm" id="e-void">${I.x}ยกเลิกรายการ</button><button class="btn sm" id="e-save">${I.check}บันทึกการแก้ไข</button></div>
    </div>`}`;
  const el = openSheet(draw());

  };

    sh.querySelectorAll("[data-ev]").forEach(b => {

      evThumb(b.dataset.ev).then(u => { b.innerHTML = `<img src="${u}" alt="">`; }).catch(() => { b.innerHTML = `<span class="st" style="position:static;background:none;color:var(--ink-3)">เปิดไม่ได้</span>`; });
    });
    const at = sh.querySelector("#e-attach");
    if (at) at.addEventListener("click", () => { closeSheet(true); attachCtx = t.id; fileInputs().cam.click(); });
    sh.querySelectorAll("[data-reason]").forEach(b => b.addEventListener("click", () => { grab(); st.reason = b.dataset.reason; sh.innerHTML = '<div class="grab"></div>' + draw(); wire(); }));
    const dB = sh.querySelector("#e-dest");
    if (dB) dB.addEventListener("click", () => { grab(); destSheet("OUT", st.dest, n => { st.dest = n; editTx(id, st); }); });
    const sv = sh.querySelector("#e-save"), vd = sh.querySelector("#e-void");
    if (sv) sv.addEventListener("click", () => submit(false));
    if (vd) vd.addEventListener("click", () => submit(true));
  };
  async function submit(isVoid) {
    grab();
    if (!st.reason) return toast("เลือกเหตุผลการแก้ไขก่อน", true);
    const p = { id: t.id, reason: st.reason };
    if (isVoid) {
      if (!(await confirmSheet("ยกเลิกรายการนี้?", "ยอดคงเหลือจะถูกปรับคืน และรายการจะแสดงเป็น “ยกเลิก” (ไม่ถูกลบ ตรวจสอบย้อนหลังได้)", "ยืนยันยกเลิก", "danger"))) return editTx(id, st);
      p.void = true;
    } else {
      if (t.type !== "COUNT") p.qty = Number(String(st.qty).replace(/,/g, ""));
      if (t.type === "OUT") p.dest = st.dest;
      if (t.type === "IN") {
        p.lot = String(st.lot || "").trim().toUpperCase();
        const e = st.exp ? parseExp(st.exp) : "";
        if (e === null) return toast("วันหมดอายุไม่ถูกต้อง", true);
        p.exp = e;
      }
    }
    closeSheet(true);
    toast("กำลังบันทึก…");
    try {
      const r = await api("edit", p);
      const x = S.drugs.get(r.drug.c);
      if (x) Object.assign(x, r.drug, { _k: x._k });
      applyOutboxOptimistic();
      [S.history && S.history.rows, S.recentTx, S.drug && S.drug.recent, S.card && S.card.rows].forEach(pool => (pool || []).forEach((y, i) => { if (y.id === t.id) pool[i] = Object.assign({}, y, r.txn, { bal: y.bal }); }));
      toast(isVoid ? "ยกเลิกรายการแล้ว · คงเหลือ " + fmtN(r.balance) : "แก้ไขแล้ว · คงเหลือ " + fmtN(r.balance));
      if (S.view === "card") openCard(true); else if (S.view === "drug") openDrug(S.drug.code, true); else render();
    } catch (e) { toast(e.message, true); }
  }
  wire();
}

/* ========================= edit drug (หัวหน้าคลัง) ========================= */
function editDrug() {
  const d = S.drugs.get(S.drug.code);

/* ========================= หน่วยบรรจุ: ตั้ง/แก้ไข ========================= */
function packEditor() {
  const d = S.drugs.get(S.drug.code), s = stockOf(d);
  const rows = (s.ps || []).slice().sort((a, b) => a.q - b.q).map(p => ({ n: p.n, q: String(p.q) }));
  if (!rows.length) rows.push({ n: "", q: "" });
  const presets = packPresets(s.u);
  const el = openSheet("");
  const sh = el.querySelector(".sheet");
  const valid = () => rows.filter(r => String(r.n).trim() || String(r.q).trim());
  const preview = () => {
    const errs = packErrors(rows, s.u);
    const ok = valid().filter((r, i) => !errs[rows.indexOf(r)]);
    return ok.length ? ok.map(r => `<b style="white-space:nowrap">1 ${esc(String(r.n).trim())} : ${fmtN(Number(String(r.q).replace(/,/g, "")))} ${esc(s.u)}</b>`).join(" · ") : `<span class="faint">ยังไม่มีหน่วยบรรจุ — จะกดนับเป็น ${esc(s.u)} อย่างเดียว</span>`;
  };
  const draw = () => {
    const errs = packErrors(rows, s.u);
    sh.innerHTML = `<div class="grab"></div><h3>หน่วยบรรจุ</h3>
      <p class="faint" style="font-size:13px;margin:0 0 10px">${esc(s.c)} · ${esc(s.n)}<br>หน่วยนับในคลัง: <b>${esc(s.u)}</b> — ยอดทุกอย่างยังบันทึกเป็น${esc(s.u)} ระบบแปลงให้</p>
      <div class="stack" style="gap:8px">
        ${rows.map((r, i) => `<div class="pack-row"><span>1</span><input class="pk-n ${errs[i] && /ชื่อ/.test(errs[i]) ? "bad" : ""}" data-i="${i}" value="${esc(r.n)}" placeholder="กล่อง" maxlength="15" aria-label="ชื่อหน่วยที่ ${i + 1}">
          <span>=</span><input class="pk-q mono ${errs[i] && /จำนวน|ซ้ำ/.test(errs[i]) ? "bad" : ""}" data-i="${i}" value="${esc(r.q)}" placeholder="500" inputmode="numeric" aria-label="จำนวนต่อหน่วยที่ ${i + 1}">
          <span>${esc(s.u)}</span><button class="icon-btn" data-del="${i}" aria-label="ลบแถว">${I.x}</button></div>
          <div class="hint bad" data-err="${i}" style="font-size:12.5px;margin:-4px 0 0 18px">${esc(errs[i])}</div>`).join("")}
        ${rows.length < 4 ? `<button class="link" id="pk-add" style="justify-self:start">${I.plus}เพิ่มหน่วย (สูงสุด 4)</button>` : ""}
        <div class="field"><label>ตัวเลือกด่วน — แตะเพื่อเติม</label><div class="reason">${presets.map(p => `<button data-pre="${p[0]}|${p[1]}">${p[0]} ${fmtN(p[1])}</button>`).join("")}</div></div>
        <div class="pack-preview" id="pk-prev">จะแสดงบนฉลากและในแอปเป็น: ${preview()}</div>
        <button class="btn" id="pk-save">${I.check}บันทึกหน่วยบรรจุ</button>
        ${(s.ps || []).length ? `<button class="btn danger sm" id="pk-clear">${I.x}ลบหน่วยบรรจุทั้งหมด</button>` : ""}
      </div>`;
    sh.querySelectorAll(".pk-n, .pk-q").forEach(inp => inp.addEventListener("input", () => {
      const i = +inp.dataset.i;
      rows[i][inp.classList.contains("pk-n") ? "n" : "q"] = inp.value;
      const e2 = packErrors(rows, s.u);
      sh.querySelectorAll("[data-err]").forEach(x => { x.textContent = e2[+x.dataset.err] || ""; });
      sh.querySelector("#pk-prev").innerHTML = "จะแสดงบนฉลากและในแอปเป็น: " + preview();
    }));
    sh.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => { rows.splice(+b.dataset.del, 1); if (!rows.length) rows.push({ n: "", q: "" }); draw(); }));
    const add = sh.querySelector("#pk-add");
    if (add) add.addEventListener("click", () => { rows.push({ n: "", q: "" }); draw(); const last = sh.querySelectorAll(".pk-n"); if (last.length) last[last.length - 1].focus(); });
    sh.querySelectorAll("[data-pre]").forEach(b => b.addEventListener("click", () => {
      const [n, q] = b.dataset.pre.split("|");
      if (rows.some(r => String(r.n).trim() === n && Number(String(r.q).replace(/,/g, "")) === +q)) return toast("มี " + n + " " + q + " อยู่แล้ว");
      const blank = rows.find(r => !String(r.n).trim() && !String(r.q).trim());
      if (blank) { blank.n = n; blank.q = q; }
      else if (rows.length < 4) rows.push({ n, q });

      draw();
    }));
    const submit = async packs => {
      try {
        const r = await api("updateDrug", { code: s.c, packs, reason: packs.length ? "ตั้งหน่วยบรรจุ" : "ลบหน่วยบรรจุ" });
        const x = S.drugs.get(r.drug.c);
        if (x) Object.assign(x, r.drug, { _k: x._k });
        closeSheet(true);

      } catch (e) { toast(e.message, true); }
    };
    sh.querySelector("#pk-save").addEventListener("click", () => {
      const errs = packErrors(rows, s.u);
      if (errs.some(Boolean)) return toast("แก้ช่องที่ขึ้นสีแดงก่อนบันทึก", true);
      submit(valid().map(r => ({ n: String(r.n).trim(), q: Number(String(r.q).replace(/,/g, "")) })));
    });

    if (clr) clr.addEventListener("click", async () => { if (await confirmSheet("ลบหน่วยบรรจุทั้งหมด?", "จะเหลือกดนับเป็น " + esc(s.u) + " อย่างเดียว", "ลบ", "danger")) submit([]); else packEditor(); });
  };
  draw();
}

let wedge = { buf: "", t: 0 };
document.addEventListener("keydown", e => {
  if (!S.me) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" && e.target.id !== "q") return;
  const now = Date.now();
  if (now - wedge.t > 120) wedge.buf = "";
  wedge.t = now;
  if (e.key === "Enter") {
    if (wedge.buf.length >= 4) { const c = resolveCode(wedge.buf); wedge.buf = ""; if (c) { e.preventDefault(); if (tag === "input") { S.search = ""; } openDrug(c); } }
    return;
  }
  if (e.key.length === 1) wedge.buf += e.key;
});
/** เปิดกล้องสแกน 1 ครั้ง → ข้อความใน QR/บาร์โค้ด ("" = ยกเลิก) */
async function scanRaw(purpose) {
  if (S.demo) return new Promise(res => demoScanSheet(c => res(c || ""), purpose === "putaway" ? Array.from(new Set((S.putaway || []).map(p => p.code))).slice(0, 9) : null));
  try {
    if (S.inLiff && liff.isApiAvailable && liff.isApiAvailable("scanCodeV2")) { const r = await liff.scanCodeV2(); return (r && r.value) || ""; }
    return await webScan();
  } catch (e) {
    if (String(e && e.message).match(/cancel/i)) return "";
    toast("เปิดกล้องไม่ได้: " + (e.message || e) + " — พิมพ์ค้นหาแทนได้", true);
    if (purpose !== "putaway") manualSheet();
    return "";
  }
}
async function scan() {
  if (!S.me) return;
  const raw = await scanRaw();
  if (!raw) return;
  const code = resolveCode(raw);
  if (!code) {
    const gs = parseGS1(raw), g = (gs && gs.gtin) || (/^\d{8,14}$/.test(String(raw).trim()) ? normGtin(raw) : "");
    toast(g ? "บาร์โค้ดผู้ผลิต " + g + " ยังไม่ผูกกับยาในระบบ — สแกน QR ที่ชั้น แล้วถ่ายรูปกล่องเพื่อจำบาร์โค้ด" : "QR นี้ไม่ใช่ฉลากยาของคลัง: " + String(raw).slice(0, 40), true);
    return;
  }
  if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) { /* */ }
  openDrug(code);
}
function webScan() {
  return new Promise((resolve, reject) => {
    const wrap = document.createElement("div");
    wrap.className = "cam";
    wrap.innerHTML = `<header><b>สแกน QR / บาร์โค้ดที่ฉลากยา</b><button class="icon-btn" style="background:rgba(255,255,255,.15);color:#fff" aria-label="ปิด">${I.x}</button></header>
      <div id="reader"><video playsinline muted></video><div class="frame"><div></div></div></div>
      <footer><button class="btn ghost sm" style="max-width:260px">${I.keyboard}พิมพ์รหัสแทน</button></footer>`;
    document.body.appendChild(wrap);
    let stream = null, stop = false, h5 = null;
    const done = (v, err) => {
      stop = true;
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (h5) h5.stop().catch(() => {});
      wrap.remove();
      err ? reject(err) : resolve(v);
    };
    wrap.querySelector("header button").onclick = () => done("");
    wrap.querySelector("footer button").onclick = () => { done(""); manualSheet(); };
    const video = wrap.querySelector("video");
    if ("BarcodeDetector" in window) {
      const want = ["qr_code", "code_128", "data_matrix", "ean_13", "ean_8", "upc_a"];
      const det = new BarcodeDetector({ formats: want });
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(s => {
        stream = s; video.srcObject = s; video.play();
        const tick = async () => {
          if (stop) return;
          try { const c = await det.detect(video); if (c && c[0]) return done(c[0].rawValue); } catch (e) { /* frame not ready */ }
          setTimeout(tick, 160);
        };
        tick();
      }).catch(e => done("", e));
      return;
    }
    // fallback: html5-qrcode (iOS Safari / LINE iOS)
    video.remove();
    const s = document.createElement("script");
    s.src = "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js";
    s.onload = () => {
      h5 = new Html5Qrcode("reader", { formatsToSupport: [0, 5, 6, 9, 10, 14] });
      h5.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, txt => done(txt), () => {}).catch(e => done("", e));
    };
    s.onerror = () => done("", new Error("โหลดตัวสแกนไม่ได้"));
    document.head.appendChild(s);
  });
}
function manualSheet() {
  const el = openSheet(`<h3>พิมพ์รหัสยา</h3><p class="faint" style="font-size:13px;margin:0 0 10px">รหัสใต้บาร์โค้ด (D0001) หรือรหัส HOSxP</p>

/* ========================= v1.2: รูปแบบยา (ไอคอน) ========================= */
const FORM_LIST = [
  ['tab', 'ยาเม็ด/แคปซูล'], ['sachet', 'ยาผง/ซอง'], ['liq', 'ยาน้ำ'], ['inj', 'ยาฉีด/วัคซีน'], ['iv', 'สารน้ำ'],
  ['herb', 'สมุนไพร'], ['cream', 'ครีม/ขี้ผึ้ง (หลอด)'], ['jar', 'ครีม (กระปุก/ตลับ)'], ['eye', 'ยาตา'], ['ear', 'ยาหยอดหู'],
  ['nose', 'ยาจมูก'], ['inhaler', 'ยาสูดพ่น'], ['neb', 'ยาพ่นฝอยละออง'], ['lotion', 'โลชั่น/แชมพู'], ['antiseptic', 'น้ำยาฆ่าเชื้อ'],
  ['mouth', 'ยาในช่องปาก'], ['supp', 'ยาเหน็บ/ยาสอด'], ['enema', 'ยาสวน'], ['patch', 'แผ่นแปะ/ปิดแผล'], ['soap', 'สบู่']
];
const FORM_LABEL = {};
FORM_LIST.forEach(f => { FORM_LABEL[f[0]] = f[1]; });

/** ชื่อในชีต ("ยาตา" หรือรหัส "eye") → รหัสรูปแบบยา; ไม่รู้จัก → "" */
function formCode(text) {
  const t = String(text === null || text === undefined ? '' : text).trim();
  if (!t) return '';
  if (FORM_LABEL[t.toLowerCase()]) return t.toLowerCase();
  const hit = FORM_LIST.find(f => f[1] === t) || FORM_LIST.find(f => f[1].split(/[\/ (]/)[0] === t.split(/[\/ (]/)[0]);
  return hit ? hit[0] : '';
}

/** เดารูปแบบยาจากชื่อ หน่วย และโซน (ใช้เมื่อชีตยังไม่ได้ระบุ) */
function inferForm(name, unit, zone) {
  const n = String(name || '').toLowerCase(), u = String(unit || '').toLowerCase().trim(), z = String(zone || '').toUpperCase();
  const has = re => re.test(n);
  if (z === 'H') return 'herb';
  if (has(/patch|แผ่นแปะ|tulle/)) return 'patch';
  if (has(/supposit|vag\.?\s*tab|ยาสอด|ยาเหน็บ|pessar|ovule/)) return 'supp';
  if (has(/enema|ยาสวน/)) return 'enema';
  if (has(/\beye\b|(?<![a-z])oph|ยาตา|หยอดตา|tear|น้ำตาเทียม|^timolol|tetracaine eye/)) return 'eye';
  if (has(/\bear\b|หยอดหู/)) return 'ear';
  if (has(/nasal|จมูก/)) return 'nose';
  if (has(/\bnb\b|nebul|respule|ventolin solution|พ่นฝอย/)) return 'neb';
  if (has(/inhal|haler|respimat|ellipta|spiriva|turbu|accu|\bevo\b|evo\./)) return 'inhaler';
  if (has(/mouth ?wash|lozenge|ยาอม|oral paste|viscous|gargle|บ้วนปาก/)) return 'mouth';
  if (has(/\bsoap\b|สบู่/)) return 'soap';
  if (has(/shampoo|แชมพู|lotion|โลชั่น/)) return 'lotion';
  if (has(/alcohol|povid|iodine|chlorhex|antiseptic|scrub|peroxide|แอลกอฮอล์/)) return 'antiseptic';
  if (has(/cream|ointment|\boint\b|jelly|\bgel\b|paste|ครีม|ขี้ผึ้ง/)) return /กระปุก|ตลับ|jar/.test(u) ? 'jar' : 'cream';
  if (has(/\bopv\b|rotarix|rotasiil|\brota\b|oral vaccine/)) return 'liq';
  if (z === 'D') return 'iv';
  const injUnit = /^(amp|ampule|vial|syringe|dose|ยูนิต|prefilled pen|mg|จุด)/.test(u);
  const injName = /\binj|injection|vaccine|insulin|immunoglob|serum|เซรุ่ม|antiserum|ฉีด|vial|\bamp\b|ampule|\bpen\b|syringe|\bbcg\b|\bipv\b|espogen|hypercrit|filgrastim|ri \(|measle|mumps|rubella/.test(n);
  if (z === 'C' || ((z === 'R' || z === 'N') && (injUnit || injName))) return 'inj';
  if (z === 'B') return 'liq';
  if (/syr|syrup|solution|suspension|ยาน้ำ|drops?\b|elixir/.test(n) || u === 'ขวด') return z === 'E' ? 'cream' : 'liq';
  if (z === 'A' || z === 'N' || z === 'R') return (u === 'ซอง' || /powder|ผง|sachet|granule/.test(n)) ? 'sachet' : 'tab';
  if (z === 'E') return 'cream';
  if (/^(เม็ด|แคปซูล|tab|cap)/.test(u)) return 'tab';
  if (injUnit) return 'inj';
  return 'tab';
}

const FORM_ICON = {

function normGtin(g) { g = String(g || "").replace(/\D/g, ""); while (g.length > 13 && g[0] === "0") g = g.slice(1); return g; }

function parseGS1(text) {
  const t = String(text || "").trim();
  if (!t) return null;
  const f = {};
  let m, re = /\((\d{2,4})\)([^(]*)/g;
  while ((m = re.exec(t))) f[m[1]] = m[2].trim();
  if (!Object.keys(f).length) {
    const s = t.replace(/^\](d2|C1|Q3|e0)/, "");
    if (!/^(01|02)\d{14}/.test(s)) return null;
    let i = 0;
    while (i < s.length) {
      const ai = s.substr(i, 2);
      if (ai === "01" || ai === "02") { f[ai] = s.substr(i + 2, 14); i += 16; }
      else if (["11", "13", "15", "17"].indexOf(ai) >= 0) { f[ai] = s.substr(i + 2, 6); i += 8; }
      else if (ai === "10" || ai === "21") { let j = s.indexOf("\x1d", i + 2); if (j < 0) j = s.length; f[ai] = s.slice(i + 2, j); i = j + 1; }
      else break;
    }
  }
  const r = {};
  if (f["01"]) r.gtin = normGtin(f["01"]);
  if (f["10"]) r.lot = f["10"].toUpperCase().replace(/[^A-Z0-9\-\/\.]/g, "").slice(0, 30);
  if (/^\d{6}$/.test(f["17"] || "")) { const y = 2000 + +f["17"].slice(0, 2), mo = f["17"].slice(2, 4), dd = f["17"].slice(4, 6); if (+mo >= 1 && +mo <= 12) r.exp = y + "-" + mo + (dd !== "00" ? "-" + dd : ""); }

  return r.gtin || r.lot || r.exp ? r : null;
}
const ZX = { p: null };
function loadZxing() {
  if (ZX.p) return ZX.p;
  ZX.p = new Promise((res, rej) => {
    if (window.ZXingWASM) return res(window.ZXingWASM);
    const sc = document.createElement("script");
    sc.src = ZXING.js; sc.onload = () => window.ZXingWASM ? res(window.ZXingWASM) : rej(new Error("ZXing ไม่พร้อม"));
    sc.onerror = () => rej(new Error("โหลดตัวอ่านบาร์โค้ดไม่ได้"));
    document.head.appendChild(sc);
  }).then(Z => {
    const wasm = ZXING.wasmB64 ? URL.createObjectURL(new Blob([Uint8Array.from(atob(ZXING.wasmB64), c => c.charCodeAt(0))], { type: "application/wasm" })) : new URL(ZXING.wasm, location.href).href;
    Z.prepareZXingModule({ overrides: { locateFile: (p, prefix) => (p.endsWith(".wasm") ? wasm : prefix + p) } });

/** อ่านบาร์โค้ดทุกชนิดในภาพ (DataMatrix GS1 บนกล่องยา, EAN-13, QR, Code128) — ทำในเครื่อง ไม่ส่งออก */
async function decodeBarcodes(canvas) {
  const Z = await loadZxing();
  const img = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
  const res = await Promise.race([
    Z.readBarcodes(img, { formats: ["DataMatrix", "QRCode", "EAN13", "EAN8", "UPCA", "Code128", "DataBar", "DataBarExp"], tryHarder: true, maxNumberOfSymbols: 8, textMode: "HRI" }),
    new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 9000))
  ]);

async function uploadPhoto(ph, attachTxn) {
  ph.state = "up"; ph.err = "";
  const r = await api("evidenceAdd", { image: ph._b64, thumb: (ph.thumb || "").split(",")[1] || "", mime: "image/jpeg", code: ph.code, read: !attachTxn, barcodes: ph.barcodes || [] });
  Object.assign(ph, { id: r.evidence.id, state: "done", read: r.read || null, readError: r.readError || "", dup: !!r.dup, dupMeta: r.dup ? r.evidence : null, prior: r.prior || [] });
  delete ph._b64;
  if (attachTxn) {
    const a = await api("evidenceAttach", { txn: attachTxn, ids: [r.evidence.id] });
    [S.history && S.history.rows, S.recentTx, S.drug && S.drug.recent, S.card && S.card.rows].forEach(pool => (pool || []).forEach((y, i) => { if (y.id === attachTxn) pool[i] = Object.assign({}, y, a.txn, { bal: y.bal }); }));
    toast("แนบภาพหลักฐานแล้ว");
    return;
  }
  if (r.read && r.read.doc) {
    const doc = r.read.doc, R = S.rx;
    if (doc.no && !R.doc.no) R.doc.no = doc.no;
    if (doc.type && !R.doc.type) R.doc.type = doc.type;
    if (doc.supplier && !R.doc.supplier) R.doc.supplier = doc.supplier;
  }
}
function rxPhotoSheet(key) {
  const ph = S.rx && S.rx.photos.find(p => p.key === key);
  if (!ph) return;
  const el = openSheet(`<h3>ภาพหลักฐาน</h3>${ph.thumb ? `<img src="${ph.thumb}" alt="" style="width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#000">` : ""}
    <p class="faint" style="font-size:13px">${ph.id ? "รหัส " + esc(ph.id) + " · " : ""}${esc(PH_LABEL[ph.state] || "")}${ph.read && ph.read.doc && ph.read.doc.type ? " · " + esc(ph.read.doc.type) : ""}${ph.barcodes && ph.barcodes.length ? " · บาร์โค้ด " + ph.barcodes.length : ""}</p>
    ${ph.err ? `<div class="err-box">${esc(ph.err)}</div>` : ""}
    <div class="stack" style="margin-top:10px">
      ${ph.state === "err" && ph._b64 ? `<button class="btn m-IN" data-r="retry">${I.refresh}ลองส่งใหม่</button>` : ""}
      ${ph.id ? `<button class="btn ghost" data-r="view">${I.search}ดูภาพเต็ม</button>` : ""}
      <button class="btn danger sm" data-r="del">${I.x}เอาภาพนี้ออกจากรอบรับ</button></div>`);
  el.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", async () => {
    const r = b.dataset.r;
    closeSheet(true);
    if (r === "view") openViewer(ph.id, ph.thumb);
    if (r === "del") { S.rx.photos.splice(S.rx.photos.indexOf(ph), 1); persistRx(); rerender(); toast(ph.id ? "เอาออกจากรอบนี้แล้ว (ไฟล์ยังเก็บในระบบ)" : "เอาภาพออกแล้ว"); }
    if (r === "retry") { try { await uploadPhoto(ph); } catch (e) { ph.state = "err"; ph.err = e.message; } persistRx(); if (S.drug) rxFill(S.drug.code, true); rerender(); }
  }));
}
function rxSheet() {
  const R = S.rx;
  if (!R) return;
  const items = rxItems();
  const el = openSheet(`<h3>รอบรับของ${R.doc.no ? " · " + esc(R.doc.no) : ""}</h3>
    <p class="faint" style="font-size:13px;margin:0 0 10px">${esc([R.doc.type, R.doc.supplier].filter(Boolean).join(" · ") || "จากภาพที่ถ่าย")} · ${R.photos.length} ภาพ</p>
    ${items.length ? `<div class="others">${items.map(x => { const od = x.code ? S.drugs.get(x.code) : null, done = od && R.received[stockCodeOf(od.c)];
      return od ? `<button class="o ${done ? "done" : ""}" data-c="${esc(od.c)}">${ftile(od, { noPa: true })}<span class="grow"><b>${done ? "✓ " : ""}${esc(od.n)}</b><small>${x.it.qty ? fmtN(x.it.qty) + " " + esc(x.it.qtyUnit) : ""}${x.it.lot ? " · Lot " + esc(x.it.lot) : ""}${done ? " · รับแล้ว" : ""}</small></span>${I.chev}</button>`
        : `<div class="o"><span class="grow"><b>${esc(x.it.name || "(ไม่มีชื่อ)")}</b><small>ไม่พบในทะเบียน — ค้นหาแล้วรับเข้าเอง</small></span></div>`; }).join("")}</div>`
      : `<div class="empty">ยังไม่มีรายการที่อ่านได้</div>`}
    <button class="btn soft" style="margin-top:12px" data-r="end">${I.x}จบรอบรับ (ล้างภาพจากหน้าจอ)</button>`);
  el.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => { closeSheet(true); S.mode = "IN"; store.set("mode", "IN"); openDrug(b.dataset.c); }));
  el.querySelector('[data-r="end"]').addEventListener("click", () => { closeSheet(true); rxEnd(); });
}
async function rxEnd() {
  const R = S.rx;
  if (!R) return;
  const items = rxItems().filter(x => x.code && !R.received[stockCodeOf(x.code)]);
  if (items.length && !(await confirmSheet("จบรอบรับ?", `ยังไม่ได้ลงรับ ${items.length} รายการที่อ่านได้จากภาพ (${esc(items.slice(0, 2).map(x => S.drugs.get(x.code).n).join(", "))}${items.length > 2 ? " …" : ""})<br>ภาพยังเก็บในระบบ แนบเพิ่มภายหลังได้จากประวัติ`, "จบรอบรับ", "danger"))) return;
  S.rx = null; persistRx();
  if (S.drug) { S.drug.src = {}; }
  toast("จบรอบรับแล้ว"); rerender();
}
function rxBanner() {
  const R = S.rx;
  if (!R || !R.photos.length || S.mode !== "IN") return "";
  const items = rxItems().filter(x => x.code), done = items.filter(x => R.received[stockCodeOf(x.code)]).length;
  return `<button class="warn" data-act="rxSheet" style="width:100%;text-align:left;background:var(--in-soft);color:var(--in)">${I.camera}<span>รอบรับของ${R.doc.no ? " " + esc(R.doc.no) : ""} · ${R.photos.length} ภาพ${items.length ? ` · รับแล้ว ${done}/${items.length} รายการ` : ""} — แตะเพื่อดูรายการถัดไป</span></button>`;
}
/** ภาพหลักฐานของรายการ (ใช้ในหน้าประวัติ/บัตรคลัง) */
const evCache = {};
async function evThumb(id) {
  if (evCache[id]) return evCache[id];
  const r = await api("evidenceGet", { id, size: "thumb" });
  return (evCache[id] = "data:" + r.mime + ";base64," + r.data);
}
async function openViewer(id, preview) {
  const wrap = document.createElement("div");
  wrap.className = "viewer";
  wrap.innerHTML = `<header><b>ภาพหลักฐาน</b><span class="faint" id="vw-meta"></span><button class="icon-btn" style="background:rgba(255,255,255,.15);color:#fff" aria-label="ปิด">${I.x}</button></header>
    <div class="pic">${preview ? `<img src="${preview}" alt="">` : `<div class="spinner"></div>`}</div><footer>${esc(id || "")}</footer>`;
  document.body.appendChild(wrap);
  wrap.querySelector("header button").onclick = () => wrap.remove();
  if (!id) return;
  try {
    const r = await api("evidenceGet", { id });
    if (!wrap.isConnected) return;
    wrap.querySelector(".pic").innerHTML = `<img src="data:${r.mime};base64,${r.data}" alt="ภาพหลักฐาน">`;
    const m = r.meta || {};
    wrap.querySelector("#vw-meta").textContent = [m.kind, m.doc, m.by, m.time ? fmtDate(m.time) + " " + fmtTime(m.time) : ""].filter(Boolean).join(" · ");
    wrap.querySelector("footer").textContent = id + ((m.txns || []).length ? " · ผูกกับรายการรับ " + m.txns.length + " รายการ" : "");
  } catch (e) { if (wrap.isConnected) wrap.querySelector(".pic").innerHTML = `<div class="err-box" style="margin:16px">${esc(e.message)}</div>`; }
}
/** ภาพของรอบนี้ที่เกี่ยวกับยานี้: ภาพเอกสาร + ภาพกล่องของยานี้ (ไม่แนบภาพกล่องของยาอื่น) */
function rxEvidenceFor(code) {
  if (!S.rx) return [];
  const st = stockCodeOf(code);
  return S.rx.photos.filter(ph => ph.id && ph.state === "done" && (
    (ph.code && stockCodeOf(ph.code) === st) ||
    (ph.read && ph.read.doc && ph.read.doc.type && ph.read.doc.type !== "กล่องยา/ฉลาก") ||
    (ph.read && (ph.read.items || []).some(it => it.match && stockCodeOf(it.match.code) === st)) ||
    (!ph.read && !ph.code))).map(ph => ph.id);
}

async function confirmReceiveDup(d, s) {
  const doc = S.doc.trim(), R = S.rx, st = s.c, session = R && R.received[st];
  let prior = rxPrior().filter(p => p.stock === st);
  if (!prior.length && doc && navigator.onLine !== false) {
    try { const r = await Promise.race([api("docCheck", { doc }), new Promise((_, j) => setTimeout(() => j(new Error("timeout")), 4000))]); prior = (r.prior || []).filter(p => p.stock === st); }
    catch (e) { prior = []; }
  }
  if (!prior.length && !session) return true;
  const list = prior.slice(0, 3).map(p => `${fmtDate(p.time)} ${fmtTime(p.time)} · ＋${fmtN(p.qty)} ${esc(p.unit)}${p.lot ? " · Lot " + esc(p.lot) : ""} · ${esc(p.by)}`).join("<br>");
  return confirmSheet(prior.length ? "เอกสารนี้เคยลงรับยานี้แล้ว" : "รอบนี้รับยานี้ไปแล้ว",
    (prior.length ? `ใบ <b>${esc(doc || (R && R.doc.no) || "")}</b> ลงรับ <b>${esc(d.n)}</b> ไปแล้ว:<br>${list}<br><br>` : `รอบรับนี้บันทึกรับ ${esc(d.n)} ไปแล้ว ${fmtN(session.qty)} ${esc(s.u)}<br><br>`) +
    "ยืนยันรับเพิ่มอีกครั้งใช่หรือไม่? (เช่น ของส่งหลายรอบ)", "ยืนยันรับเพิ่ม", "m-IN");
}
function rxNext(code) {
  if (!S.rx) return null;
  const st = stockCodeOf(code);
  const x = rxItems().find(y => y.code && y.st !== st && !S.rx.received[y.st]);
  return x ? S.drugs.get(x.code) : null;
}

/* ========================= events ========================= */
const ACT = {
  go: v => { if (v === "search") S.zf = S.zf || ""; go(v); },
  back: () => back(),
  scan: () => scan(),
  open: c => openDrug(c),
  homeMode: m => { S.mode = m; store.set("mode", m); render(); },
  drugMode: m => { S.mode = m; store.set("mode", m); S.drug.counts = {}; S.drug.src = {}; if (m === "IN" && S.rx) rxFill(S.drug.code, true); refreshDrugView(); },
  pickDest: k => destSheet(k, k === "OUT" ? S.destOut : S.destIn, n => { if (k === "OUT") { S.destOut = n; store.set("destOut", n); } else { S.destIn = n; store.set("destIn", n); } S.view === "drug" ? refreshDrugView() : render(); }),
  key: k => {
    const D = S.drug, s = stockOf(S.drugs.get(D.code));
    const U = unitsOf(s);
    if (!U.some(u => u.k === D.ui)) D.ui = "base";
    const v = D.counts[D.ui] || "";
    if (D.src) delete D.src.qty;
    if (k === "C") { if (v) delete D.counts[D.ui]; else D.counts = {}; }
    else if (k === "B") { const nv = v.slice(0, -1); if (nv) D.counts[D.ui] = nv; else delete D.counts[D.ui]; }
    else if (v.length < 8) D.counts[D.ui] = (v === "0" ? "" : v) + k;
    refreshDrugView();
  },
  unit: k => {
    S.drug.ui = k;
    const pref = store.get("unitPref", {}) || {};
    pref[S.drug.code] = k; store.set("unitPref", pref);
    refreshDrugView();
  },
  packEditor: () => packEditor(),
  paDone: id => { const p = (S.putaway || []).find(x => x.id === id); putawayConfirm({ ids: [id], method: "button" }, p ? p.name : ""); },
  paDrug: c => putawayConfirm({ code: c, method: "button" }, (S.drugs.get(c) || {}).n || c),
  paScan: () => putawayScan(),
  paRefresh: () => { refreshPending(true); toast("กำลังอัปเดต…"); },
  rxCam: () => { attachCtx = null; fileInputs().cam.click(); },
  rxPick: () => { attachCtx = null; fileInputs().pick.click(); },
  rxPhoto: k => rxPhotoSheet(k),
  rxApply: () => { if (rxFill(S.drug.code, false)) refreshDrugView(); else toast("ไม่มีค่าที่อ่านได้สำหรับยานี้", true); },
  rxUsePack: async save => {
    const D = S.drug, s = stockOf(S.drugs.get(D.code)), line = rxLineFor(D.code);
    const q = line && resolveQty(line.it, s);
    if (!q || !q.need) return;
    const inp = document.getElementById("rx-pq"), per = Number(String((inp && inp.value) || "").replace(/,/g, ""));
    if (!(per >= 2) || Math.round(per) !== per) return toast("ใส่จำนวนต่อ 1 " + q.need.n + " เป็นจำนวนเต็ม 2 ขึ้นไป", true);
    if (save === "1") {
      const packs = (s.ps || []).filter(p => p.n !== q.need.n).map(p => ({ n: p.n, q: p.q })).concat([{ n: q.need.n, q: per }]);
      if (packs.length > 4) return toast("หน่วยบรรจุครบ 4 หน่วยแล้ว — กด “ใช้ค่านี้” แทน", true);
      try { const r = await api("updateDrug", { code: s.c, packs, reason: "ตั้งหน่วยบรรจุจากเอกสารรับเข้า" }); const x = S.drugs.get(r.drug.c); if (x) Object.assign(x, r.drug, { _k: x._k }); }
      catch (e) { return toast(e.message, true); }
      const u = unitsOf(stockOf(S.drugs.get(D.code))).find(y => y.n === q.need.n && y.q === per);
      D.counts = { [u.k]: String(q.qty) }; D.ui = u.k;
      toast("จำ 1 " + q.need.n + " = " + fmtN(per) + " " + s.u + " แล้ว");
    } else { D.counts = { base: String(round2(q.qty * per)) }; D.ui = "base"; }
    D.src = D.src || {}; D.src.qty = "ai";
    rxFill(D.code, true);
    refreshDrugView();
  },
  rxGtin: async g => {
    try {
      const r = await api("updateDrug", { code: S.drug.code, addGtin: g, reason: "จำบาร์โค้ดจากภาพรับเข้า" });
      const x = S.drugs.get(r.drug.c); if (x) Object.assign(x, r.drug, { _k: x._k });
      setDrugs(S.list); toast("จำบาร์โค้ดแล้ว — ครั้งหน้าสแกนกล่องยาเปิดรายการนี้ได้ทันที"); refreshDrugView();
    } catch (e) { toast(e.message, true); }
  },
  rxOpen: c => openDrug(c),
  rxUseLine: k => { S.rx.map[k] = S.drug.code; persistRx(); rxFill(S.drug.code, false); refreshDrugView(); },
  rxEnd: () => rxEnd(),
  rxSheet: () => rxSheet(),
  evView: id => openViewer(id),
  save: () => doSave(),
  editTx: id => editTx(id),
  openQueued: id => openQueued(id),
  histScope: v => { S.histScope = v; loadHistory(); render(); },
  openAlerts: tab => { S.alertTab = tab; go("alerts"); },
  alertTab: tab => { S.alertTab = tab; render(); },
  refreshAlerts: () => { loadAlerts(); if (S.view !== "alerts") toast("กำลังอัปเดต…"); },
  zf: z => { S.zf = S.zf === z ? "" : z; render(); },
  clearSearch: () => { S.search = ""; store.set("lastSearch", ""); render(); },
  togglePick: c => {
    const i = S.pick.findIndex(p => p.c === c);
    if (i >= 0) S.pick.splice(i, 1); else S.pick.push({ c, done: false });
    store.set("pick", S.pick);
    const y = window.scrollY; render(); window.scrollTo(0, y);
    if (i < 0) toast("เพิ่มในรายการหยิบแล้ว (" + S.pick.length + ")");
  },
  clearPick: async () => { if (await confirmSheet("ล้างรายการหยิบ?", "ลบรายการหยิบทั้งหมดในเครื่องนี้", "ล้างรายการ", "danger")) { S.pick = []; store.set("pick", []); render(); } },
  openCard: () => openCard(),
  editDrug: () => editDrug(),
  print: () => { try { window.print(); } catch (e) { toast("พิมพ์จากหน้านี้ไม่ได้", true); } },
  toggleSetting: k => { S.settings[k] = !S.settings[k]; store.set("settings", S.settings); render(); },
  reload: () => { if (S.demo) { boot(); } else location.reload(); },
  register: async () => {
    const name = $("#r-name").value.trim(), invite = $("#r-inv").value.trim();
    if (!invite && name.length < 2) return renderRegister("กรุณากรอกชื่อ-สกุล หรือรหัสเชิญ");
    renderLoading("กำลังลงทะเบียน…");
    try { const r = await api("register", { name, invite }); if (r.status === "ใช้งาน") boot(); else renderPending(); }
    catch (e) { renderRegister(e.message); }
  },
  demoRole: r => { Demo.setRole(r); navStack = []; boot(); },
  demoReset: () => { Demo.reset(); navStack = []; boot(); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.closest(".sheet")) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.arg, el, e); }
});
let searchTimer;
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.input;
  if (!k) return;
  if (k === "search") {
    S.search = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { store.set("lastSearch", S.search); const pos = e.target.selectionStart; render(); const i = $("#q"); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) { /* */ } } }, 180);
  }
  if (k === "lot") { S.drug.lot = e.target.value; if (S.drug.src) delete S.drug.src.lot; e.target.classList.remove("from-img"); }
  if (k === "doc") { S.doc = e.target.value; store.set("doc", S.doc); if (S.drug && S.drug.src) delete S.drug.src.doc; e.target.classList.remove("from-img"); }
  if (k === "exp") {
    let v = e.target.value.replace(/[^\d\/]/g, "");
    if (/^\d{3,}$/.test(v)) v = v.slice(0, 2) + "/" + v.slice(2, 6);
    e.target.value = v; S.drug.exp = v; if (S.drug.src) delete S.drug.src.exp; e.target.classList.remove("from-img");
    const ep = parseExp(v), h = $("#exp-hint");
    if (h) { const ml = ep ? monthsLeft(ep) : null; h.className = "hint " + (v ? (ep ? (ml < 6 ? "bad" : "ok") : "bad") : ""); h.textContent = v ? (ep ? fmtExp(ep) + " · อีก " + ml + " เดือน" + (ml < 6 ? " (สั้น!)" : "") : "รูปแบบไม่ถูกต้อง") : "พ.ศ. หรือ ค.ศ. ก็ได้"; }
    const btn = document.querySelector('[data-act="save"]');
    if (btn && qtyEntered(S.drug) && S.mode === "IN" && S.destIn) btn.disabled = !!(v && !ep);
  }
});
document.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.input === "exp") refreshDrugView(); });
window.addEventListener("online", () => processOutbox());

const Demo = { load() { throw new Error("ไม่มีข้อมูลสาธิต"); }, call() { throw new ApiError("ไม่ได้อยู่ในโหมดสาธิต", "DEMO"); }, setRole() {}, reset() {}, sample() { return []; } };
function demoScanSheet() {}

init();
